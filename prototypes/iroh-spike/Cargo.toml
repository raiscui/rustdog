# wayfinder #124 原型 spike:独立 crate,不进 rdog 主 workspace。
# [workspace] 空表 = 让 cargo 把本目录当成独立 workspace 根,避免被上层 workspace 接管。
[workspace]

[package]
name = "iroh-spike"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
iroh = "1.4"
iroh-relay = { version = "1.4", features = ["server"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
