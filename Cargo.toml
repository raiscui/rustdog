[package]
name = "rustdog"
version = "3.0.0"
authors = ["robiot"]
description = "The Modern Port Listener and Reverse Shell"
license = "GPL-3.0-only"
repository = "https://github.com/raiscui/rustdog"
edition = "2021"
rust-version = "1.89"

[[bin]]
name = "rdog"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.9", features = ["derive"] }
colored = "2.1.0"
rustyline = "14.0.0"
log = "0.4.22"
fern = { version = "0.6.2", features = ["colored"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
figment = { version = "0.10.19", features = ["env", "toml", "test"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
enigo = "0.6.1"
base64 = "0.22.1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
httparse = "1.10.1"
rand = "0.9.2"
sha1 = "0.10.6"
sha2 = "0.10.9"
url = "2.5.8"
uuid = { version = "1.18.1", features = ["v4"] }
xcap = "0.9.4"
zenoh = { version = "1.8.0", default-features = false, features = ["transport_serial", "transport_tcp", "transport_udp", "transport_unixpipe", "auth_usrpwd"] }

[dev-dependencies]
# agent mailbox e2e: 测试进程直接 zenoh pub 投递 inbox 消息
zenoh = { version = "1.8.0", default-features = false, features = ["transport_tcp", "auth_usrpwd"] }

[target.'cfg(target_os = "macos")'.dependencies]
sck-rs = { git = "https://github.com/screenpipe/sck-rs" }

[target.'cfg(unix)'.dependencies]
termios = "0.3"
signal-hook = "0.3.17"
portable-pty = "0.9.0"
# control_flow 进程组终止信号直发 (kill(2)); 已是依赖树间接依赖, 直接引用零成本
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }
