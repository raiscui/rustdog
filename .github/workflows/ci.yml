name: CI

# Run the full rdog test suite on every push to main and every PR.
# Matrix 覆盖 macOS (生产目标)、Ubuntu (最常见的 CI runner) 与 Windows
# (2026-10-06 加入: 跨平台测试修复后 bin 单测可全平台跑)。
# Windows 执行记录很重要 — `#[cfg(windows)]` 门的测试 (win_dpi /
# zenoh_router_client_windows 等) 在 mac/ubuntu 上从不编译, 假设从未被检验过,
# 真机实证已经连续抓出两颗这类雷 (伪句柄判据 / json5 转义)。
# recording e2e 套件仍限 unix (POSIX-only control transport / unixpipe)。
#
# 结构: 每个 OS 一对 job —— `build (<os>)` → `test (<os>)`, 后者只依赖**同一 OS**
# 的 build (所以一个平台的外部依赖红了, 不会连带吞掉其它平台的测试证据)。
# 同 OS 的 test 被跳过 = 测试未运行, test 红 = 测试失败。口径:
# docs/agents/ci-merge-gate.md §3。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # 默认类型不含 ready_for_review, 草稿期开立的 PR 标 ready 后不会触发任何 run,
    # 页面上却留着历史 commit 状态 —— 门会把"该 head 0 个必需检查"读成"没有失败"。
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  build-ubuntu:
    name: build (ubuntu-latest)
    uses: ./.github/workflows/build-phase.yml
    with:
      os: ubuntu-latest

  build-macos:
    name: build (macos-latest)
    uses: ./.github/workflows/build-phase.yml
    with:
      os: macos-latest

  build-windows:
    name: build (windows-latest)
    uses: ./.github/workflows/build-phase.yml
    with:
      os: windows-latest

  test-ubuntu:
    name: test (ubuntu-latest)
    needs: [build-ubuntu]
    uses: ./.github/workflows/test-phase.yml
    with:
      os: ubuntu-latest

  test-macos:
    name: test (macos-latest)
    needs: [build-macos]
    uses: ./.github/workflows/test-phase.yml
    with:
      os: macos-latest

  test-windows:
    name: test (windows-latest)
    needs: [build-windows]
    uses: ./.github/workflows/test-phase.yml
    with:
      os: windows-latest

  # 知识载体守卫 (docs/agents/knowledge-carriers.md 的约定 ① / ③)。
  # 与平台无关, 纯静态检查, 所以单独一个 job, 不进测试矩阵。
  knowledge-carriers:
    name: knowledge carriers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 记账检查要读 git 历史 (判定 commit 是否进账本), shallow clone 不够
          fetch-depth: 0

      # 约定 ①: 载体 (skill / README / specs) 里的断言必须与 src/ 真相源一致。
      # 2026-10-22 实测: 同一份过时的换算公式曾同时住在 6 处载体, HiDPI 下差 2 倍。
      - name: Carrier assertions match src/
        run: python3 scripts/check-carrier-assertions.py

      # 约定 ③: 工作 commit 必须进六文件账本。
      # **只报告不阻断**: 账本滞后是流程债, 不该卡住别人推送; 漏账条目用
      # ::warning:: 注解显示在提交/PR 视图, 而不是把整轮 CI 拉红。
      # 本地要硬门禁就跑 `python3 scripts/check-bookkeeping.py` (默认 strict)。
      - name: Commits accounted in the ledger (report only)
        if: github.event_name == 'push'
        run: python3 scripts/check-bookkeeping.py --report-only --limit 50
