name: CI

# Run the full rdog test suite on every push to main and every PR.
# Matrix covers macOS (the production target), Ubuntu (most CI runners)
# and Windows (2026-10-06 加入: 跨平台测试修复后 bin 单测可全平台跑).
# Windows 执行记录很重要 — `#[cfg(windows)]` 门的测试 (win_dpi /
# zenoh_router_client_windows 等) 在 mac/ubuntu 上从不编译, 假设从未被
# 检验过, 真机实证已经连续抓出两颗这类雷 (伪句柄判据 / json5 转义).
# recording e2e 套件仍限 unix (POSIX-only control transport / unixpipe).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # xcap 截图栈在 linux 上的原生链接依赖 (上游 xcap README 的 Ubuntu 清单):
      # libwayland-dev / libegl-dev 供 wayland-sys build script 做 pkg-config 探测,
      # libclang-dev 供 libwayshot bindgen, 其余为 X11/dbus/pipewire 侧构建依赖。
      # 没有这些包时 wayland-sys v0.31.11 的 build.rs 会在 pkg-config 失败处直接
      # panic (自仓库基线起 ubuntu job 一直因此全红, 2026-08-28 修复)。
      - name: Install linux build deps (xcap screen-capture stack)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libclang-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libegl-dev \
            libgbm-dev \
            libdrm-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          # Stay aligned with the `rust-version = "1.89"` MSRV declared
          # in Cargo.toml; bumping it must be a deliberate Cargo.toml
          # change so this workflow keeps passing on the declared
          # floor.
          # components: rustfmt, clippy  # re-enable after the existing
          # formatting / clippy debt is cleared (see follow-up).

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --bin rdog

      # Unit tests inside the rdog binary (recording handler,
      # lifecycle, journal, etc.). The handler-level tests in
      # `src/control_recording/` cover the auto-stop / StopTrigger
      # invariants; the integration tests in `tests/control_lanes.rs`
      # etc. cover the daemon's line-control surface.
      - name: Unit tests
        run: cargo test --bin rdog

      # Recording e2e suite: spawn a real rdog daemon subprocess,
      # drive it over TCP / unixpipe, and assert the auto-stop
      # pipeline commits a bundle and stamps the right stop_trigger.
      # The suite is `#[cfg(unix)]` and only runs on Linux / macOS.
      - name: Recording e2e tests
        if: runner.os != 'Windows'
        run: cargo test --test recording_e2e

  # 知识载体守卫 (docs/agents/knowledge-carriers.md 的约定 ① / ③)。
  # 与平台无关, 纯静态检查, 所以单独一个 job, 不进测试矩阵。
  knowledge-carriers:
    name: knowledge carriers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 记账检查要读 git 历史 (判定 commit 是否进账本), shallow clone 不够
          fetch-depth: 0

      # 约定 ①: 载体 (skill / README / specs) 里的断言必须与 src/ 真相源一致。
      # 2026-10-22 实测: 同一份过时的换算公式曾同时住在 6 处载体, HiDPI 下差 2 倍。
      - name: Carrier assertions match src/
        run: python3 scripts/check-carrier-assertions.py

      # 约定 ③: 工作 commit 必须进六文件账本。
      # 只在 push 到 main 时判定 —— PR 阶段的工作 commit 还没到记账点。
      - name: Commits are accounted in the ledger
        if: github.event_name == 'push'
        run: python3 scripts/check-bookkeeping.py --limit 50
