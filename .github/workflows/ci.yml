name: CI


# Run the full rdog test suite on every push to main and every PR.
# Matrix 覆盖 macOS (生产目标)、Ubuntu (最常见的 CI runner) 与 Windows
# (2026-10-06 加入: 跨平台测试修复后 bin 单测可全平台跑)。
# Windows 执行记录很重要 — `#[cfg(windows)]` 门的测试 (win_dpi /
# zenoh_router_client_windows 等) 在 mac/ubuntu 上从不编译, 假设从未被检验过,
# 真机实证已经连续抓出两颗这类雷 (伪句柄判据 / json5 转义)。
# recording e2e 套件仍限 unix (POSIX-only control transport / unixpipe)。
#

# 结构: 每个 OS 一对 job —— `build (<os>)` → `test (<os>)`, 后者只依赖**同一 OS**
# 的 build (所以一个平台的外部依赖红了, 不会连带吞掉其它平台的测试证据)。
# 同 OS 的 test 被跳过 = 测试未运行, test 红 = 测试失败。口径:
# docs/agents/ci-merge-gate.md §3。
#
# **不要改用 reusable workflow (`uses:`)**: GitHub 会把被调用工作流里的检查重命名成
# `<caller name> / <callee name>`, 与必需检查表里的 `build (os)` / `test (os)` 就对不上
# 了 (2026-11-26 评审实测: `build (macos-latest) / build`)。三段 build / 两段 test 的
# 步骤文本因此是复制的, 改一处要改三处。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # 默认类型不含 ready_for_review, 草稿期开立的 PR 标 ready 后不会触发任何 run,
    # 页面上却留着历史 commit 状态 —— 门会把"该 head 0 个必需检查"读成"没有失败"。
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  # `&job-timeout-minutes` 是 job 墙钟上限的**单一定义**: 下面每个 job 的 `timeout-minutes`
  # 与 integration 预算 (`RDOG_JOB_TIMEOUT_MINUTES`) 都引用它。改一处漏一处 = 下一次
  # 「预算算出剩余 3299s 却被 cancel」。(GitHub Actions 不接受自定义顶层键, 所以 anchor 挂在
  # 第一个 job 上而不是文件头。)
  build-ubuntu:
    name: build (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: &job-timeout-minutes 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/cargo-prep

      - name: Build
        shell: bash
        run: cargo build --bin rdog

      # 只编译不运行: 编译期错误归到"测试没跑", 而不是在 test job 里被读成"测试失败"
      # (那样零执行断言会被 cargo 的编译失败直接跳过)。
      - name: Compile test targets
        shell: bash
        # 全 target 编译 (不加 --test): `tests/` 下 19 个 target 一个都不能漏,
        # 包括只在 macOS 上存在的 GUI 面 —— 它们在别的平台编译成空二进制,
        # 但编译错误照样在这里红 (RAI-411)。
        run: cargo test --no-run

      # build 红了就代表这次运行对该 OS **没有测试证据** —— 把这句话写进 job summary,
      # 免得下次又有人拿一个"红点"当"测试失败"去翻几千行日志。
      - name: Classify the failure (coverage gap vs code)
        if: failure()
        shell: bash
        run: |
          {
            echo "### build (ubuntu-latest) failed — no test evidence for this OS"
            echo ""
            cat scripts/ci/coverage-gap-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

  build-macos:
    name: build (macos-latest)
    runs-on: macos-latest
    timeout-minutes: *job-timeout-minutes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/cargo-prep

      - name: Build
        shell: bash
        run: cargo build --bin rdog

      # 只编译不运行: 编译期错误归到"测试没跑", 而不是在 test job 里被读成"测试失败"
      # (那样零执行断言会被 cargo 的编译失败直接跳过)。
      - name: Compile test targets
        shell: bash
        # 全 target 编译 (不加 --test): `tests/` 下 19 个 target 一个都不能漏,
        # 包括只在 macOS 上存在的 GUI 面 —— 它们在别的平台编译成空二进制,
        # 但编译错误照样在这里红 (RAI-411)。
        run: cargo test --no-run

      # build 红了就代表这次运行对该 OS **没有测试证据** —— 把这句话写进 job summary,
      # 免得下次又有人拿一个"红点"当"测试失败"去翻几千行日志。
      - name: Classify the failure (coverage gap vs code)
        if: failure()
        shell: bash
        run: |
          {
            echo "### build (macos-latest) failed — no test evidence for this OS"
            echo ""
            cat scripts/ci/coverage-gap-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    name: build (windows-latest)
    runs-on: windows-latest
    # Windows 要静态链接 341MB 的 onnxruntime.lib, 编译 + 链接 + 测试都比 unix 慢一截。
    timeout-minutes: *job-timeout-minutes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/cargo-prep

      - name: Build
        shell: bash
        run: cargo build --bin rdog

      # 只编译不运行: 编译期错误归到"测试没跑", 而不是在 test job 里被读成"测试失败"
      # (那样零执行断言会被 cargo 的编译失败直接跳过)。
      - name: Compile test targets
        shell: bash
        # 全 target 编译 (不加 --test): `tests/` 下 19 个 target 一个都不能漏,
        # 包括只在 macOS 上存在的 GUI 面 —— 它们在别的平台编译成空二进制,
        # 但编译错误照样在这里红 (RAI-411)。
        run: cargo test --no-run

      # ort-sys 会把 dist 里的 DirectML.dll 复制到可执行文件旁边; 复制不到时测试二进制
      # 会在加载阶段失败。显式断言一次, 让"dylib 没铺到"与"测试逻辑失败"分开。
      - name: Assert ort runtime DLL staged next to the binary
        shell: bash
        run: |
          staged=$(find target/debug -maxdepth 2 -name 'DirectML.dll')
          if [ -z "$staged" ]; then
            echo "::error title=onnxruntime runtime DLL missing::ort-sys copy-dylibs staged no DirectML.dll under target/debug; the test binaries would fail at load time"
            exit 1
          fi
          echo "$staged"

      # build 红了就代表这次运行对该 OS **没有测试证据** —— 把这句话写进 job summary,
      # 免得下次又有人拿一个"红点"当"测试失败"去翻几千行日志。
      - name: Classify the failure (coverage gap vs code)
        if: failure()
        shell: bash
        run: |
          {
            echo "### build (windows-latest) failed — no test evidence for this OS"
            echo ""
            cat scripts/ci/coverage-gap-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

  test-ubuntu:
    name: test (ubuntu-latest)
    needs: [build-ubuntu]
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout-minutes

    steps:
      - name: Record job start (integration budget baseline)
        shell: bash
        run: date +%s > "$RUNNER_TEMP/job-started-at"

      - name: Checkout
        uses: actions/checkout@v4

      # 与同 OS 的 build 共用同一份准备与同一份缓存 key, 所以这一步复用 build 的产物。
      - uses: ./.github/actions/cargo-prep

      # Unit tests inside the rdog binary (recording handler, lifecycle, journal, daemon
      # lanes...): 覆盖 `src/**` 里的 `#[cfg(test)]` 模块。`tests/` 下的 integration
      # target 由下面的 Integration targets 步骤按平台执行 (清单与计数判据都在
      # scripts/ci/run-integration-targets.py)。
      # pipefail 必需: 没有它 tee 的退出码会盖掉 cargo 的失败。
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --bin rdog 2>&1 | tee unit-tests.log

      # 退出码 0 不等于跑过: filter 打错、测试全被 #[ignore]、平台门把整组编译掉
      # (本仓库大量 `#[cfg(windows)]`) 都会静默变成"绿但零执行"。
      - name: Assert unit tests actually ran
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/ci/assert-tests-ran.py unit-tests.log --label "unit tests (ubuntu-latest)"

      # RAI-411: `tests/` 下的 integration target 以前一个都没在 CI 跑过。
      # 清单与每个 target 的「实际执行计数 > 0」判据都在脚本里; 需要真实桌面的
      # target 在该脚本里标为 compile-only 并写进 job summary, 不做静默 skip。
      - name: Integration targets
        shell: bash
        env:
          # 预算按**job 真实剩余时间**算: 起点写在 job 第一个 step, 时间上限由下面传入。
          # 常数预算 + 前缀 (checkout/cargo-prep/unit tests) 会越过 job timeout 被 cancel。
          RDOG_JOB_STARTED_AT_FILE: ${{ runner.temp }}/job-started-at
          RDOG_JOB_TIMEOUT_MINUTES: *job-timeout-minutes
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/ci/run-integration-targets.py --os ubuntu-latest

      # Recording e2e suite: spawn a real rdog daemon subprocess, drive it over TCP /
      # unixpipe, and assert the auto-stop pipeline commits a bundle and stamps the
      # right stop_trigger. The suite is `#[cfg(unix)]`: Linux / macOS only.
      - name: Recording e2e tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --test recording_e2e 2>&1 | tee recording-e2e.log

      - name: Assert recording e2e tests actually ran
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/ci/assert-tests-ran.py recording-e2e.log --label "recording e2e (ubuntu-latest)"

  test-macos:
    name: test (macos-latest)
    needs: [build-macos]
    runs-on: macos-latest
    timeout-minutes: *job-timeout-minutes

    steps:
      - name: Record job start (integration budget baseline)
        shell: bash
        run: date +%s > "$RUNNER_TEMP/job-started-at"

      - name: Checkout
        uses: actions/checkout@v4

      # 与同 OS 的 build 共用同一份准备与同一份缓存 key, 所以这一步复用 build 的产物。
      - uses: ./.github/actions/cargo-prep

      # Unit tests inside the rdog binary (recording handler, lifecycle, journal, daemon
      # lanes...): 覆盖 `src/**` 里的 `#[cfg(test)]` 模块。`tests/` 下的 integration
      # target 由下面的 Integration targets 步骤按平台执行 (清单与计数判据都在
      # scripts/ci/run-integration-targets.py)。
      # pipefail 必需: 没有它 tee 的退出码会盖掉 cargo 的失败。
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --bin rdog 2>&1 | tee unit-tests.log

      # 退出码 0 不等于跑过: filter 打错、测试全被 #[ignore]、平台门把整组编译掉
      # (本仓库大量 `#[cfg(windows)]`) 都会静默变成"绿但零执行"。
      - name: Assert unit tests actually ran
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/ci/assert-tests-ran.py unit-tests.log --label "unit tests (macos-latest)"

      # RAI-411: `tests/` 下的 integration target 以前一个都没在 CI 跑过。
      # 清单与每个 target 的「实际执行计数 > 0」判据都在脚本里; 需要真实桌面的
      # target 在该脚本里标为 compile-only 并写进 job summary, 不做静默 skip。
      - name: Integration targets
        shell: bash
        env:
          # 预算按**job 真实剩余时间**算: 起点写在 job 第一个 step, 时间上限由下面传入。
          # 常数预算 + 前缀 (checkout/cargo-prep/unit tests) 会越过 job timeout 被 cancel。
          RDOG_JOB_STARTED_AT_FILE: ${{ runner.temp }}/job-started-at
          RDOG_JOB_TIMEOUT_MINUTES: *job-timeout-minutes
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/ci/run-integration-targets.py --os macos-latest

      # Recording e2e suite: spawn a real rdog daemon subprocess, drive it over TCP /
      # unixpipe, and assert the auto-stop pipeline commits a bundle and stamps the
      # right stop_trigger. The suite is `#[cfg(unix)]`: Linux / macOS only.
      - name: Recording e2e tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --test recording_e2e 2>&1 | tee recording-e2e.log

      - name: Assert recording e2e tests actually ran
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/ci/assert-tests-ran.py recording-e2e.log --label "recording e2e (macos-latest)"

  test-windows:
    name: test (windows-latest)
    needs: [build-windows]
    runs-on: windows-latest
    timeout-minutes: *job-timeout-minutes

    steps:
      - name: Record job start (integration budget baseline)
        shell: bash
        run: date +%s > "$RUNNER_TEMP/job-started-at"

      - name: Checkout
        uses: actions/checkout@v4

      # 与同 OS 的 build 共用同一份准备与同一份缓存 key, 所以这一步复用 build 的产物。
      - uses: ./.github/actions/cargo-prep

      # Unit tests inside the rdog binary (recording handler, lifecycle, journal, daemon
      # lanes...): 覆盖 `src/**` 里的 `#[cfg(test)]` 模块。`tests/` 下的 integration
      # target 由下面的 Integration targets 步骤按平台执行 (清单与计数判据都在
      # scripts/ci/run-integration-targets.py)。
      # pipefail 必需: 没有它 tee 的退出码会盖掉 cargo 的失败。
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --bin rdog 2>&1 | tee unit-tests.log

      # 退出码 0 不等于跑过: filter 打错、测试全被 #[ignore]、平台门把整组编译掉
      # (本仓库大量 `#[cfg(windows)]`) 都会静默变成"绿但零执行"。
      - name: Assert unit tests actually ran
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/ci/assert-tests-ran.py unit-tests.log --label "unit tests (windows-latest)"

      # RAI-411: `tests/` 下的 integration target 以前一个都没在 CI 跑过。
      # 清单与每个 target 的「实际执行计数 > 0」判据都在脚本里; 需要真实桌面的
      # target 在该脚本里标为 compile-only 并写进 job summary, 不做静默 skip。
      - name: Integration targets
        shell: bash
        env:
          # 预算按**job 真实剩余时间**算: 起点写在 job 第一个 step, 时间上限由下面传入。
          # 常数预算 + 前缀 (checkout/cargo-prep/unit tests) 会越过 job timeout 被 cancel。
          RDOG_JOB_STARTED_AT_FILE: ${{ runner.temp }}/job-started-at
          RDOG_JOB_TIMEOUT_MINUTES: *job-timeout-minutes
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/ci/run-integration-targets.py --os windows-latest

  # 知识载体守卫 (docs/agents/knowledge-carriers.md 的约定 ① / ③)。
  # 与平台无关, 纯静态检查, 所以单独一个 job, 不进测试矩阵。
  knowledge-carriers:
    name: knowledge carriers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 记账检查要读 git 历史 (判定 commit 是否进账本), shallow clone 不够。
          # PR 上取 head sha 而不是 GitHub 造的 merge commit, 否则 --since base 的口径会飘。
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # 约定 ①: 载体 (skill / README / specs) 里的断言必须与 src/ 真相源一致。
      # 2026-10-22 实测: 同一份过时的换算公式曾同时住在 6 处载体, HiDPI 下差 2 倍。
      - name: Carrier assertions match src/
        run: python3 scripts/check-carrier-assertions.py

      # 约定 ③: 工作 commit 必须进账本 (RAI-433 起按票分文件 `ledger/<票号>.md`)。
      #
      # 两档, 按分支分而不是按心情分:
      # - **PR**: 只报告 (::warning::)。账本滞后是流程债, 不该卡住别人推送; 而且 PR 的 sha
      #   会随 rebase 变, 在 PR 阶段要求 sha 等于强制每人写一个马上过期的值。
      # - **main**: `--main` 硬门禁, 两件事两个判据:
      #   · 完全没有账本条目的 commit → 最新 10 个位置内宽限;
      #   · 有占位只差 sha → 按**时间**判 (--max-placeholder-age-days, 默认 3 天) 超期即红,
      #     这样任何规模的合并合入当天 main 必绿, 忘补在 3 天后被抓。
      - name: Commits accounted in the ledger - PR report only
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          python3 scripts/check-bookkeeping.py --report-only --since "origin/${{ github.base_ref }}"

      - name: Commits accounted in the ledger - main requires sha beyond grace
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/check-bookkeeping.py --main --main-grace 10 --limit 50
